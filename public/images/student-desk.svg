<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- Fond papier chaud -->
  <rect width="400" height="260" fill="#f6f3ec"/>

  <!-- Trame de points discrète -->
  <g opacity="0.35">
    <circle cx="20" cy="20" r="1" fill="#d6cfc0"/>
    <circle cx="40" cy="20" r="1" fill="#d6cfc0"/>
    <circle cx="60" cy="20" r="1" fill="#d6cfc0"/>
    <circle cx="80" cy="20" r="1" fill="#d6cfc0"/>
    <circle cx="20" cy="40" r="1" fill="#d6cfc0"/>
    <circle cx="40" cy="40" r="1" fill="#d6cfc0"/>
    <circle cx="60" cy="40" r="1" fill="#d6cfc0"/>
    <circle cx="80" cy="40" r="1" fill="#d6cfc0"/>
  </g>

  <!-- Ombre du carnet -->
  <ellipse cx="200" cy="228" rx="140" ry="10" fill="#141219" opacity="0.08"/>

  <!-- Carnet ouvert (deux pages) -->
  <g transform="rotate(-3 200 140)">
    <!-- Page gauche -->
    <path d="M 60 70 L 195 62 L 195 210 L 60 218 Z" fill="#ffffff" stroke="#d6cfc0" stroke-width="1.5"/>
    <!-- Page droite -->
    <path d="M 205 62 L 340 70 L 340 218 L 205 210 Z" fill="#ffffff" stroke="#d6cfc0" stroke-width="1.5"/>
    <!-- Reliure centrale -->
    <line x1="200" y1="62" x2="200" y2="212" stroke="#d6cfc0" stroke-width="2"/>

    <!-- Lignes page gauche -->
    <g stroke="#e6e1d6" stroke-width="1">
      <line x1="80" y1="90" x2="175" y2="86"/>
      <line x1="80" y1="108" x2="175" y2="104"/>
      <line x1="80" y1="126" x2="175" y2="122"/>
      <line x1="80" y1="144" x2="175" y2="140"/>
      <line x1="80" y1="162" x2="175" y2="158"/>
      <line x1="80" y1="180" x2="175" y2="176"/>
      <line x1="80" y1="198" x2="140" y2="195"/>
    </g>

    <!-- Titre page droite (violet) -->
    <rect x="222" y="84" width="90" height="8" rx="2" fill="#7e55ff"/>

    <!-- Paragraphe page droite -->
    <g stroke="#e6e1d6" stroke-width="1">
      <line x1="222" y1="108" x2="320" y2="105"/>
      <line x1="222" y1="122" x2="320" y2="119"/>
      <line x1="222" y1="136" x2="320" y2="133"/>
      <line x1="222" y1="150" x2="300" y2="147"/>
    </g>

    <!-- Surlignage jaune -->
    <rect x="222" y="165" width="70" height="7" rx="1" fill="#3fcc3b" opacity="0.35"/>

    <!-- Lignes en dessous -->
    <g stroke="#e6e1d6" stroke-width="1">
      <line x1="222" y1="182" x2="320" y2="179"/>
      <line x1="222" y1="196" x2="290" y2="193"/>
    </g>
  </g>

  <!-- Stylo -->
  <g transform="rotate(28 320 200)">
    <rect x="316" y="130" width="8" height="90" rx="3" fill="#320094"/>
    <path d="M 316 220 L 320 240 L 324 220 Z" fill="#141219"/>
    <rect x="316" y="130" width="8" height="14" fill="#9d80ff"/>
  </g>

  <!-- Petite gomme -->
  <rect x="270" y="222" width="26" height="14" rx="3" fill="#7e55ff"/>
  <rect x="270" y="222" width="26" height="5" rx="2" fill="#9d80ff"/>
</svg>